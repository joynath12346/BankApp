services:
  - type: web
    name: aegis-bank-api
    runtime: python
    rootDir: backend_django
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn aegis_bank.wsgi:application
    healthCheckPath: /api/v1/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-bank-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true

  - type: web
    name: aegis-bank-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aegis-bank-api
          property: host
          envVarKey: RENDER_EXTERNAL_HOSTNAME

databases:
  - name: aegis-bank-db
    plan: free
